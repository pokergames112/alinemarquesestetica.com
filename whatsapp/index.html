    <p>Redirecionando para o WhatsApp...</p>

    <script>
        // Pega o texto da URL (se existir) para manter a mensagem personalizada
        const params = new URLSearchParams(window.location.search);
        const text = params.get('text');
        
        let url = "https://api.whatsapp.com/send?phone=5511991549233";
        if (text) {
            url += "&text=" + encodeURIComponent(text);
        }

        // Aguarda 500ms para garantir que as tags disparem no GTM e redireciona
        setTimeout(function() {
            window.location.href = url;
        }, 500);
    </script>
